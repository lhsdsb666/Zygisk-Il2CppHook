name: Repackage CN APK

# ============================================================
# 免 root 汉化整合包流水线：
#   1. Gradle 编译原生库（Zygisk 模块 + 免 root 独立注入库 libhack.so）
#   2. 从 Release 资产下载原版 base.apk 与 split_config.arm64_v8a.apk
#      （需先在仓库 Releases 发布一个标签，比如 apk，上传这两个文件）
#   3. apktool 反编译 base → 合并 split 的 arm64 原生库
#      → 注入 libhack.so / 字典 assets / HackProvider.smali / Manifest 声明
#      → 重打包 → zipalign → apksigner 签名
#   4. 产出 trickcal-revive-cn.apk 为 workflow artifact
# ============================================================
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "存放原版 APK 的 Release 标签（资产需含 base.apk 与 split_config.arm64_v8a.apk）"
        required: true
        default: "apk"

jobs:
  build-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build native modules (zygisk module + standalone libhack.so)
        run: |
          chmod +x ./gradlew
          ./gradlew :module:assembleRelease --no-daemon

      - name: Collect libhack.so (arm64)
        run: |
          mkdir -p native-out
          HACK_SO=$(find module/build -path '*stripped_native_libs*' -name 'libhack.so' -path '*arm64*' | head -1)
          if [ -z "$HACK_SO" ]; then
            HACK_SO=$(find module/build -name 'libhack.so' -path '*arm64*' | head -1)
          fi
          echo "libhack.so = $HACK_SO"
          test -n "$HACK_SO"
          cp "$HACK_SO" native-out/libhack.so
          file native-out/libhack.so || true
          ls -la native-out/

      - uses: actions/upload-artifact@v4
        with:
          name: libhack
          path: native-out/libhack.so

  repackage:
    runs-on: ubuntu-latest
    needs: build-native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: libhack
          path: native-out

      - name: Download original APKs from release assets
        run: |
          mkdir -p apk-in
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.release_tag }}"
          echo "downloading from $BASE_URL"
          curl -fL --retry 3 -o apk-in/base.apk "$BASE_URL/base.apk"
          curl -fL --retry 3 -o apk-in/split.apk "$BASE_URL/split_config.arm64_v8a.apk"
          ls -la apk-in/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare apktool
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -O apktool.jar
          java -jar apktool.jar --version

      - name: Locate Android build-tools (zipalign/apksigner)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools = $BT"
          echo "BT=$BT" >> "$GITHUB_ENV"
          ls "$BT" | grep -E 'zipalign|apksigner'

      - name: Decompile base APK (apktool)
        run: |
          java -jar apktool.jar d apk-in/base.apk -o decoded -f
          echo '--- decoded top level ---'
          ls decoded

      - name: Merge split arm64 native libs
        run: |
          mkdir -p split-x
          (cd split-x && unzip -o -q ../apk-in/split.apk 'lib/*')
          mkdir -p decoded/lib
          cp -r split-x/lib/* decoded/lib/
          echo '--- merged native libs count ---'
          ls decoded/lib/arm64-v8a/ | wc -l
          ls decoded/lib/arm64-v8a/ | head -40

      - name: Inject libhack.so + dict asset + HackProvider smali
        run: |
          cp native-out/libhack.so decoded/lib/arm64-v8a/libhack.so
          cp repackage/assets/string_data.txt decoded/assets/string_data.txt
          mkdir -p decoded/smali/com/epidgames/trickcalrevive/hack
          cp repackage/smali/HackProvider.smali \
             decoded/smali/com/epidgames/trickcalrevive/hack/HackProvider.smali
          # 删除 Google Play 来源戳（属于旧签名证书，重签后不匹配，可能导致安装失败）
          rm -f decoded/stamp-cert-sha256
          echo '--- injected files ---'
          ls -la decoded/lib/arm64-v8a/libhack.so decoded/assets/string_data.txt
          ls -la decoded/smali/com/epidgames/trickcalrevive/hack/

      - name: Register HackProvider in AndroidManifest.xml
        run: |
          python3 repackage/inject_manifest.py decoded/AndroidManifest.xml
          grep -A2 HackProvider decoded/AndroidManifest.xml || true

      - name: Rebuild APK (apktool b)
        run: |
          java -jar apktool.jar b decoded -o trickcal-cn-unsigned.apk
          ls -la trickcal-cn-unsigned.apk

      - name: zipalign + sign (v1+v2+v3, self-signed)
        run: |
          "$BT/zipalign" -f -p 4 trickcal-cn-unsigned.apk trickcal-cn-aligned.apk
          keytool -genkeypair -v -keystore hack.keystore -alias hack \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Trickcal Revive CN, OU=Mod, O=Mod, L=NA, ST=NA, C=CN"
          "$BT/apksigner" sign --ks hack.keystore \
            --ks-pass pass:android --key-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out trickcal-revive-cn.apk trickcal-cn-aligned.apk
          echo '--- verify ---'
          "$BT/apksigner" verify --verbose trickcal-revive-cn.apk | head -20
          ls -la trickcal-revive-cn.apk

      - name: Sanity check package contents
        run: |
          unzip -l trickcal-revive-cn.apk | grep -E 'libhack\.so|string_data\.txt|classes.*\.dex' | head -20
          unzip -l trickcal-revive-cn.apk | grep -c 'lib/arm64-v8a/.*\.so'

      - uses: actions/upload-artifact@v4
        with:
          name: trickcal-revive-cn-apk
          path: trickcal-revive-cn.apk
